<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="credential-flow-en-mobile-title credential-flow-en-mobile-desc"><title id="credential-flow-en-mobile-title">Credential injection on egress</title><desc id="credential-flow-en-mobile-desc">Agent. Requests an API operation. Uses a limited gateway identity; Gateway. Authenticates the request. Evaluates user, action and resource; Gateway injects. Adds the upstream credential. Credential service supplies it after approval; Upstream API. Receives the forwarded request. Gateway records the decision without secrets</desc><rect width="700" height="850" fill="#ffffff"/><defs><marker id="a-credential-flow-en-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Credential injection on egress</text><rect x="195" y="180" width="310" height="365" rx="10" fill="none" stroke="#e8a05a" stroke-width="2" stroke-dasharray="7 5"/><text x="211" y="205.0" text-anchor="start" fill="#b75b0c" font-size="16" font-weight="bold">GATEWAY</text><path d="M350 165 V220" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-en-mobile)"/><path d="M350 310 V345" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-en-mobile)"/><path d="M350 440 V595" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-en-mobile)"/><rect x="215" y="90" width="270" height="75" rx="8" fill="#fdf3e8"/><text x="350.0" y="123.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Agent</text><text x="350.0" y="150.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Requests an API operation</text><rect x="225" y="220" width="250" height="90" rx="8" fill="#fdf3e8"/><text x="350.0" y="260.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Gateway</text><text x="350.0" y="287.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Authenticates the request</text><rect x="225" y="350" width="250" height="90" rx="8" fill="#fdf3e8"/><text x="350.0" y="379.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Gateway injects</text><text x="350.0" y="406.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Adds the upstream</text><text x="350.0" y="428.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">credential</text><rect x="215" y="600" width="270" height="90" rx="8" fill="#fdf3e8"/><text x="350.0" y="629.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Upstream API</text><text x="350.0" y="656.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Receives the forwarded</text><text x="350.0" y="678.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">request</text><rect x="25" y="350" width="175" height="95" rx="8" fill="#eef4fa"/><text x="112.5" y="404.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Policy</text><rect x="500" y="350" width="175" height="95" rx="8" fill="#eef4fa"/><text x="587.5" y="404.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Token store</text><path d="M200 396 H225" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-en-mobile)"/><path d="M500 396 H475" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-en-mobile)"/><text x="350.0" y="755.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">Credential service supplies it after approval</text></g></svg>