<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="reply-eval-es-dark-mobile-title reply-eval-es-dark-mobile-desc"><title id="reply-eval-es-dark-mobile-title">Comprobar una respuesta con la evidencia</title><desc id="reply-eval-es-dark-mobile-desc">Caso del cliente. Tarjeta caducada y pago fallido. El agente investiga la cuenta; Sesión registrada. Se guardan llamadas y resultados. El código comprueba si tuvieron éxito; Borrador. El modelo identifica acciones afirmadas. Contrastar cada afirmación con la sesión; Decisión. Aprobar o rechazar según las pruebas. El rechazo incluye un motivo explícito</desc><rect width="700" height="850" fill="#16212c"/><defs><marker id="a-reply-eval-es-dark-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">Comprobar una respuesta con la evidencia</text><rect x="35" y="125" width="270" height="115" rx="8" fill="#44392e"/><text x="170.0" y="167.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Sesión registrada</text><text x="170.0" y="194.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Se guardan llamadas y</text><text x="170.0" y="216.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">resultados</text><rect x="395" y="125" width="270" height="115" rx="8" fill="#44392e"/><text x="530.0" y="167.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Borrador</text><text x="530.0" y="194.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">El modelo identifica acciones</text><text x="530.0" y="216.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">afirmadas</text><rect x="190" y="370" width="320" height="115" rx="8" fill="#44392e"/><text x="350.0" y="423.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Evaluación</text><text x="350.0" y="450.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Contrasta con la sesión</text><rect x="190" y="615" width="320" height="115" rx="8" fill="#44392e"/><text x="350.0" y="657.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Decisión</text><text x="350.0" y="684.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Aprobar o rechazar según las</text><text x="350.0" y="706.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">pruebas</text><path d="M170 240 V300 H280 V370" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-reply-eval-es-dark-mobile)"/><path d="M530 240 V300 H420 V370" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-reply-eval-es-dark-mobile)"/><path d="M350 485 V615" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-reply-eval-es-dark-mobile)"/><text x="350.0" y="815.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">El rechazo incluye un motivo explícito</text></g></svg>