<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="ir-flow-es-mobile-title ir-flow-es-mobile-desc"><title id="ir-flow-es-mobile-title">Alerta SSH: investigación y respuesta</title><desc id="ir-flow-es-mobile-desc">Alerta de Wazuh. Una regla coincide con eventos SSH. La alerta es un motivo para investigar; Análisis. Revisar equipo, origen e intervalo. Registrar evidencias y datos ausentes; Decisión de respuesta. Determinar autoridad y límites del cliente. Si se autoriza, seguir un runbook; Acción y revisión. Verificar el resultado y registrar el caso. Active Response es una vía automática aparte</desc><rect width="700" height="850" fill="#ffffff"/><defs><marker id="a-ir-flow-es-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Alerta SSH: investigación y respuesta</text><rect x="215" y="105" width="270" height="100" rx="8" fill="#fdf3e8"/><text x="350.0" y="139.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Alerta de Wazuh</text><text x="350.0" y="166.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Una regla coincide con</text><text x="350.0" y="188.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">eventos SSH</text><rect x="45" y="300" width="270" height="115" rx="8" fill="#fdf3e8"/><text x="180.0" y="342.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Análisis</text><text x="180.0" y="369.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Revisar equipo, origen e</text><text x="180.0" y="391.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">intervalo</text><rect x="385" y="300" width="270" height="115" rx="8" fill="#fdf3e8"/><text x="520.0" y="353.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Active Response</text><text x="520.0" y="380.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Solo si se configura</text><rect x="45" y="540" width="270" height="115" rx="8" fill="#fdf3e8"/><text x="180.0" y="582.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Decisión de respuesta</text><text x="180.0" y="609.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Determinar autoridad y límites</text><text x="180.0" y="631.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">del cliente</text><rect x="385" y="540" width="270" height="115" rx="8" fill="#fdf3e8"/><text x="520.0" y="582.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Acción y revisión</text><text x="520.0" y="609.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Verificar el resultado y</text><text x="520.0" y="631.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">registrar el caso</text><path d="M290 205 V250 H180 V300" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-ir-flow-es-mobile)"/><path d="M410 205 V250 H520 V300" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-ir-flow-es-mobile)"/><path d="M180 415 V540" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-ir-flow-es-mobile)"/><path d="M520 415 V540" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-ir-flow-es-mobile)"/><text x="350.0" y="815.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">Active Response es una vía automática aparte</text></g></svg>