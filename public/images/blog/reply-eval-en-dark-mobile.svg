<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="reply-eval-en-dark-mobile-title reply-eval-en-dark-mobile-desc"><title id="reply-eval-en-dark-mobile-title">Checking a support reply against evidence</title><desc id="reply-eval-en-dark-mobile-desc">Customer case. A card expired and payment failed. The agent investigates the account; Recorded session. Tool calls and results are captured. Code checks whether actions succeeded; Draft reply. The model identifies claimed actions. Compare each claim against the session; Decision. Approve supported claims or reject. A rejected reply has an explicit reason</desc><rect width="700" height="850" fill="#16212c"/><defs><marker id="a-reply-eval-en-dark-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">Checking a support reply against evidence</text><rect x="35" y="125" width="270" height="115" rx="8" fill="#44392e"/><text x="170.0" y="167.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Recorded session</text><text x="170.0" y="194.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Tool calls and results are</text><text x="170.0" y="216.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">captured</text><rect x="395" y="125" width="270" height="115" rx="8" fill="#44392e"/><text x="530.0" y="167.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Draft reply</text><text x="530.0" y="194.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">The model identifies claimed</text><text x="530.0" y="216.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">actions</text><rect x="190" y="370" width="320" height="115" rx="8" fill="#44392e"/><text x="350.0" y="423.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Evaluator</text><text x="350.0" y="450.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Compare claims to the session</text><rect x="190" y="615" width="320" height="115" rx="8" fill="#44392e"/><text x="350.0" y="668.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Decision</text><text x="350.0" y="695.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Approve supported claims or reject</text><path d="M170 240 V300 H280 V370" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-reply-eval-en-dark-mobile)"/><path d="M530 240 V300 H420 V370" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-reply-eval-en-dark-mobile)"/><path d="M350 485 V615" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-reply-eval-en-dark-mobile)"/><text x="350.0" y="815.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">A rejected reply has an explicit reason</text></g></svg>