<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="local-model-loop-en-dark-title local-model-loop-en-dark-desc"><title id="local-model-loop-en-dark-title">Moving one task to a local specialist</title><desc id="local-model-loop-en-dark-desc">Examples. Real cases, rules and documentation. A frontier model produces synthetic sessions; Fine-tuning. Reviewed sessions train a LoRA adapter. The base model remains unchanged; Private benchmark. Compare candidates on fixed tasks. Failures guide further training data; Deployment. A specialist takes over when ready. An evaluator checks each proposed reply</desc><rect width="1200" height="650" fill="#16212c"/><defs><marker id="a-local-model-loop-en-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">Moving one task to a local specialist</text><path d="M350 185 H850" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-en-dark)"/><path d="M985 240 V425" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-en-dark)"/><path d="M850 480 H350" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-en-dark)"/><path d="M1120 480 H1160 V95 H215 V130" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-en-dark)"/><rect x="80" y="130" width="270" height="110" rx="8" fill="#44392e"/><text x="215.0" y="169.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Examples</text><text x="215.0" y="196.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Real cases, rules and</text><text x="215.0" y="218.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">documentation</text><rect x="850" y="130" width="270" height="110" rx="8" fill="#44392e"/><text x="985.0" y="169.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Fine-tuning</text><text x="985.0" y="196.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Reviewed sessions train a</text><text x="985.0" y="218.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">LoRA adapter</text><rect x="850" y="425" width="270" height="110" rx="8" fill="#44392e"/><text x="985.0" y="464.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Private benchmark</text><text x="985.0" y="491.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Compare candidates on fixed</text><text x="985.0" y="513.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">tasks</text><rect x="80" y="425" width="270" height="110" rx="8" fill="#44392e"/><text x="215.0" y="464.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Deployment</text><text x="215.0" y="491.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">A specialist takes over when</text><text x="215.0" y="513.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">ready</text><text x="600.0" y="335.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">Failures guide further training data</text></g></svg>