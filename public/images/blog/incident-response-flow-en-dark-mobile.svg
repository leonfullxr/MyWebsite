<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="ir-flow-en-dark-mobile-title ir-flow-en-dark-mobile-desc"><title id="ir-flow-en-dark-mobile-title">SSH alert: investigation and response</title><desc id="ir-flow-en-dark-mobile-desc">Wazuh alert. A rule matches authentication events. The alert is a reason to investigate; Analyst triage. Review the host, source and time window. Record evidence and missing telemetry; Response decision. Determine authority and customer limits. If authorized, follow a runbook; Action and review. Verify the result and record the case. Active Response is a separate automatic path</desc><rect width="700" height="850" fill="#16212c"/><defs><marker id="a-ir-flow-en-dark-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">SSH alert: investigation and response</text><rect x="215" y="105" width="270" height="100" rx="8" fill="#44392e"/><text x="350.0" y="139.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Wazuh alert</text><text x="350.0" y="166.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">A rule matches authentication</text><text x="350.0" y="188.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">events</text><rect x="45" y="300" width="270" height="115" rx="8" fill="#44392e"/><text x="180.0" y="342.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Analyst triage</text><text x="180.0" y="369.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Review the host, source and</text><text x="180.0" y="391.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">time window</text><rect x="385" y="300" width="270" height="115" rx="8" fill="#44392e"/><text x="520.0" y="353.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Active Response</text><text x="520.0" y="380.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Only if configured</text><rect x="45" y="540" width="270" height="115" rx="8" fill="#44392e"/><text x="180.0" y="582.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Response decision</text><text x="180.0" y="609.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Determine authority and</text><text x="180.0" y="631.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">customer limits</text><rect x="385" y="540" width="270" height="115" rx="8" fill="#44392e"/><text x="520.0" y="582.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Action and review</text><text x="520.0" y="609.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Verify the result and record</text><text x="520.0" y="631.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">the case</text><path d="M290 205 V250 H180 V300" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark-mobile)"/><path d="M410 205 V250 H520 V300" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark-mobile)"/><path d="M180 415 V540" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark-mobile)"/><path d="M520 415 V540" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark-mobile)"/><text x="350.0" y="815.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">Active Response is a separate automatic path</text></g></svg>