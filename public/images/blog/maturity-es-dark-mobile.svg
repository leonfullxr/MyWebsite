<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="maturity-es-dark-mobile-title maturity-es-dark-mobile-desc"><title id="maturity-es-dark-mobile-title">Ingeniería de detección: evaluar y mejorar</title><desc id="maturity-es-dark-mobile-desc">Niveles 0 y 1. Prácticas fundacionales y básicas. Elegir una fuente de datos o amenaza; Niveles 2 y 3. Prácticas intermedias y avanzadas. Registrar cobertura, responsables y pruebas; Nivel 4. Prácticas expertas. Elegir una laguna y una mejora sostenible; Repetir. Revisar avances y volver a evaluar. Niveles adaptados de Elastic DEBMM</desc><rect width="700" height="850" fill="#16212c"/><defs><marker id="a-maturity-es-dark-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">Ingeniería de detección: evaluar y mejorar</text><rect x="55" y="130" width="260" height="115" rx="8" fill="#44392e"/><text x="185.0" y="172.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Niveles 0 y 1</text><text x="185.0" y="199.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Prácticas fundacionales y</text><text x="185.0" y="221.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">básicas</text><rect x="385" y="270" width="260" height="115" rx="8" fill="#44392e"/><text x="515.0" y="312.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Niveles 2 y 3</text><text x="515.0" y="339.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Prácticas intermedias y</text><text x="515.0" y="361.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">avanzadas</text><rect x="55" y="410" width="260" height="115" rx="8" fill="#44392e"/><text x="185.0" y="463.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Nivel 4</text><text x="185.0" y="490.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Prácticas expertas</text><rect x="385" y="550" width="260" height="115" rx="8" fill="#44392e"/><text x="515.0" y="592.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Repetir</text><text x="515.0" y="619.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Revisar avances y volver a</text><text x="515.0" y="641.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">evaluar</text><path d="M315 185 H350 V325 H385" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-maturity-es-dark-mobile)"/><path d="M385 325 H350 V465 H315" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-maturity-es-dark-mobile)"/><path d="M315 465 H350 V605 H385" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-maturity-es-dark-mobile)"/><text x="350.0" y="805.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">Niveles adaptados de Elastic DEBMM</text></g></svg>