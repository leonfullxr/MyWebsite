<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 678" role="img" aria-labelledby="flow-es-title flow-es-desc">
<title id="flow-es-title">De una alerta SSH de Wazuh a la respuesta</title>
<desc id="flow-es-desc">Alerta de Wazuh. La actividad SSH coincide con una regla; Análisis. Revisar el contexto y recopilar pruebas; Decisión. Escalar y obtener autorización si procede; Respuesta. Usar el runbook adecuado para el equipo; Revisión. Comprobar el resultado y actualizar la guía</desc>
<rect width="960" height="678" rx="24" fill="#faf8f3"/>
<g font-family="Arial, sans-serif">
<text x="48" y="64" font-size="26" font-weight="700" fill="#202c34">De una alerta SSH de Wazuh a la respuesta</text>
<rect x="48" y="92" width="864" height="74" rx="12" fill="#fff" stroke="#e0d6c8"/>
<circle cx="82" cy="129" r="19" fill="#e65b38"/>
<text x="82" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">01</text>
<text x="120" y="122" font-size="20" font-weight="700" fill="#202c34">Alerta de Wazuh</text>
<text x="120" y="147" font-size="17" fill="#58626a">La actividad SSH coincide con una regla</text>
<path d="M 82 164 V 182" stroke="#c7b8a8" stroke-width="3"/>
<rect x="48" y="184" width="864" height="74" rx="12" fill="#fff" stroke="#e0d6c8"/>
<circle cx="82" cy="221" r="19" fill="#e65b38"/>
<text x="82" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">02</text>
<text x="120" y="214" font-size="20" font-weight="700" fill="#202c34">Análisis</text>
<text x="120" y="239" font-size="17" fill="#58626a">Revisar el contexto y recopilar pruebas</text>
<path d="M 82 256 V 274" stroke="#c7b8a8" stroke-width="3"/>
<rect x="48" y="276" width="864" height="74" rx="12" fill="#fff" stroke="#e0d6c8"/>
<circle cx="82" cy="313" r="19" fill="#e65b38"/>
<text x="82" y="319" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">03</text>
<text x="120" y="306" font-size="20" font-weight="700" fill="#202c34">Decisión</text>
<text x="120" y="331" font-size="17" fill="#58626a">Escalar y obtener autorización si procede</text>
<path d="M 82 348 V 366" stroke="#c7b8a8" stroke-width="3"/>
<rect x="48" y="368" width="864" height="74" rx="12" fill="#fff" stroke="#e0d6c8"/>
<circle cx="82" cy="405" r="19" fill="#e65b38"/>
<text x="82" y="411" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">04</text>
<text x="120" y="398" font-size="20" font-weight="700" fill="#202c34">Respuesta</text>
<text x="120" y="423" font-size="17" fill="#58626a">Usar el runbook adecuado para el equipo</text>
<path d="M 82 440 V 458" stroke="#c7b8a8" stroke-width="3"/>
<rect x="48" y="460" width="864" height="74" rx="12" fill="#fff" stroke="#e0d6c8"/>
<circle cx="82" cy="497" r="19" fill="#e65b38"/>
<text x="82" y="503" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">05</text>
<text x="120" y="490" font-size="20" font-weight="700" fill="#202c34">Revisión</text>
<text x="120" y="515" font-size="17" fill="#58626a">Comprobar el resultado y actualizar la guía</text>
<text x="48" y="648" font-size="15" fill="#667077">Flujo ilustrativo. Las autorizaciones y herramientas pueden variar.</text></g></svg>
