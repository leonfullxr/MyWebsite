<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 586" role="img" aria-labelledby="layers-es-title layers-es-desc">
<title id="layers-es-title">Cuatro capas conectadas de respuesta</title>
<desc id="layers-es-desc">Política. Responsables y acciones que requieren autorización; Procedimiento. Escalado y autoridad para cada tipo de incidente; Guía de detección. Qué significa la alerta de Wazuh y qué investigar; Runbook técnico. Cómo ejecutar y comprobar una acción aprobada</desc>
