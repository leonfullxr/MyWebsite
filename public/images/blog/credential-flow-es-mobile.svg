<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="credential-flow-es-mobile-title credential-flow-es-mobile-desc"><title id="credential-flow-es-mobile-title">Inyección de credenciales a la salida</title><desc id="credential-flow-es-mobile-desc">Agente. Solicita una operación de API. Usa una identidad de pasarela limitada; Pasarela. Autentica la petición. Evalúa usuario, acción y recurso; La pasarela inyecta. Añade la credencial del servicio. El almacén la facilita tras la autorización; API de destino. Recibe la petición enviada. La pasarela registra la decisión sin secretos</desc><rect width="700" height="850" fill="#ffffff"/><defs><marker id="a-credential-flow-es-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Inyección de credenciales a la salida</text><rect x="195" y="180" width="310" height="365" rx="10" fill="none" stroke="#e8a05a" stroke-width="2" stroke-dasharray="7 5"/><text x="211" y="205.0" text-anchor="start" fill="#b75b0c" font-size="16" font-weight="bold">PASARELA</text><path d="M350 165 V220" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-es-mobile)"/><path d="M350 310 V345" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-es-mobile)"/><path d="M350 440 V595" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-es-mobile)"/><rect x="215" y="90" width="270" height="75" rx="8" fill="#fdf3e8"/><text x="350.0" y="123.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Agente</text><text x="350.0" y="150.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Solicita una operación de API</text><rect x="225" y="220" width="250" height="90" rx="8" fill="#fdf3e8"/><text x="350.0" y="260.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Pasarela</text><text x="350.0" y="287.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Autentica la petición</text><rect x="225" y="350" width="250" height="90" rx="8" fill="#fdf3e8"/><text x="350.0" y="379.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">La pasarela inyecta</text><text x="350.0" y="406.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Añade la credencial del</text><text x="350.0" y="428.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">servicio</text><rect x="215" y="600" width="270" height="90" rx="8" fill="#fdf3e8"/><text x="350.0" y="640.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">API de destino</text><text x="350.0" y="667.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Recibe la petición enviada</text><rect x="25" y="350" width="175" height="95" rx="8" fill="#eef4fa"/><text x="112.5" y="404.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Política</text><rect x="500" y="350" width="175" height="95" rx="8" fill="#eef4fa"/><text x="587.5" y="404.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Almacén</text><path d="M200 396 H225" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-es-mobile)"/><path d="M500 396 H475" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-credential-flow-es-mobile)"/><text x="350.0" y="755.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">El almacén la facilita tras la autorización</text></g></svg>