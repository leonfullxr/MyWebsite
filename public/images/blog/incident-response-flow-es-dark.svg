<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="ir-flow-es-dark-title ir-flow-es-dark-desc"><title id="ir-flow-es-dark-title">Alerta SSH: investigación y respuesta</title><desc id="ir-flow-es-dark-desc">Alerta de Wazuh. Una regla coincide con eventos SSH. La alerta es un motivo para investigar; Análisis. Revisar equipo, origen e intervalo. Registrar evidencias y datos ausentes; Decisión de respuesta. Determinar autoridad y límites del cliente. Si se autoriza, seguir un runbook; Acción y revisión. Verificar el resultado y registrar el caso. Active Response es una vía automática aparte</desc><rect width="1200" height="650" fill="#16212c"/><defs><marker id="a-ir-flow-es-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">Alerta SSH: investigación y respuesta</text><rect x="40" y="260" width="230" height="110" rx="8" fill="#44392e"/><text x="155.0" y="299.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Alerta de Wazuh</text><text x="155.0" y="326.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Una regla coincide con</text><text x="155.0" y="348.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">eventos SSH</text><rect x="365" y="120" width="240" height="110" rx="8" fill="#44392e"/><text x="485.0" y="159.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Análisis</text><text x="485.0" y="186.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Revisar equipo, origen e</text><text x="485.0" y="208.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">intervalo</text><rect x="720" y="120" width="240" height="110" rx="8" fill="#44392e"/><text x="840.0" y="159.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Decisión de respuesta</text><text x="840.0" y="186.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Determinar autoridad y</text><text x="840.0" y="208.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">límites del cliente</text><rect x="365" y="405" width="240" height="110" rx="8" fill="#44392e"/><text x="485.0" y="455.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Active Response</text><text x="485.0" y="482.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Solo si se configura</text><rect x="720" y="405" width="240" height="110" rx="8" fill="#44392e"/><text x="840.0" y="444.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Acción y revisión</text><text x="840.0" y="471.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Verificar el resultado y</text><text x="840.0" y="493.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">registrar el caso</text><path d="M270 285 H315 V175 H365" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-es-dark)"/><path d="M270 345 H315 V460 H365" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-es-dark)"/><path d="M605 175 H720" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-es-dark)"/><path d="M605 460 H720" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-es-dark)"/><text x="600.0" y="615.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">Active Response es una vía automática aparte</text></g></svg>