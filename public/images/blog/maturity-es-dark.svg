<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="maturity-es-dark-title maturity-es-dark-desc"><title id="maturity-es-dark-title">Ingeniería de detección: evaluar y mejorar</title><desc id="maturity-es-dark-desc">Niveles 0 y 1. Prácticas fundacionales y básicas. Elegir una fuente de datos o amenaza; Niveles 2 y 3. Prácticas intermedias y avanzadas. Registrar cobertura, responsables y pruebas; Nivel 4. Prácticas expertas. Elegir una laguna y una mejora sostenible; Repetir. Revisar avances y volver a evaluar. Niveles adaptados de Elastic DEBMM</desc><rect width="1200" height="650" fill="#16212c"/><defs><marker id="a-maturity-es-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">Ingeniería de detección: evaluar y mejorar</text><rect x="35" y="395" width="245" height="105" rx="8" fill="#44392e"/><text x="157.5" y="432.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Niveles 0 y 1</text><text x="157.5" y="459.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Prácticas fundacionales y</text><text x="157.5" y="481.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">básicas</text><rect x="325" y="320" width="245" height="105" rx="8" fill="#44392e"/><text x="447.5" y="357.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Niveles 2 y 3</text><text x="447.5" y="384.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Prácticas intermedias y</text><text x="447.5" y="406.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">avanzadas</text><rect x="615" y="245" width="245" height="105" rx="8" fill="#44392e"/><text x="737.5" y="293.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Nivel 4</text><text x="737.5" y="320.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Prácticas expertas</text><rect x="905" y="170" width="245" height="105" rx="8" fill="#44392e"/><text x="1027.5" y="207.0" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Repetir</text><text x="1027.5" y="234.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Revisar avances y volver a</text><text x="1027.5" y="256.0" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">evaluar</text><path d="M280 447 H305 V372 H325" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-maturity-es-dark)"/><path d="M570 372 H595 V297 H615" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-maturity-es-dark)"/><path d="M860 297 H885 V222 H905" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-maturity-es-dark)"/><text x="600.0" y="605.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">Niveles adaptados de Elastic DEBMM</text></g></svg>