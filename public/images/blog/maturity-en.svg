<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="maturity-en-title maturity-en-desc"><title id="maturity-en-title">Detection engineering: assess and improve</title><desc id="maturity-en-desc">Tiers 0 and 1. Foundation and basic practices. Begin with a defined data source or threat; Tiers 2 and 3. Intermediate and advanced practices. Record coverage, ownership and test evidence; Tier 4. Expert practices. Choose one gap and a sustainable improvement; Repeat. Review progress and reassess. Tier names adapted from Elastic DEBMM</desc><rect width="1200" height="650" fill="#ffffff"/><defs><marker id="a-maturity-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Detection engineering: assess and improve</text><rect x="35" y="395" width="245" height="105" rx="8" fill="#fdf3e8"/><text x="157.5" y="432.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Tiers 0 and 1</text><text x="157.5" y="459.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Foundation and basic</text><text x="157.5" y="481.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">practices</text><rect x="325" y="320" width="245" height="105" rx="8" fill="#fdf3e8"/><text x="447.5" y="357.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Tiers 2 and 3</text><text x="447.5" y="384.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Intermediate and advanced</text><text x="447.5" y="406.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">practices</text><rect x="615" y="245" width="245" height="105" rx="8" fill="#fdf3e8"/><text x="737.5" y="293.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Tier 4</text><text x="737.5" y="320.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Expert practices</text><rect x="905" y="170" width="245" height="105" rx="8" fill="#fdf3e8"/><text x="1027.5" y="207.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Repeat</text><text x="1027.5" y="234.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Review progress and</text><text x="1027.5" y="256.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">reassess</text><path d="M280 447 H305 V372 H325" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-maturity-en)"/><path d="M570 372 H595 V297 H615" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-maturity-en)"/><path d="M860 297 H885 V222 H905" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-maturity-en)"/><text x="600.0" y="605.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">Tier names adapted from Elastic DEBMM</text></g></svg>