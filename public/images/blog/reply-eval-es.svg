<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="reply-eval-es-title reply-eval-es-desc"><title id="reply-eval-es-title">Comprobar una respuesta con la evidencia</title><desc id="reply-eval-es-desc">Caso del cliente. Tarjeta caducada y pago fallido. El agente investiga la cuenta; Sesión registrada. Se guardan llamadas y resultados. El código comprueba si tuvieron éxito; Borrador. El modelo identifica acciones afirmadas. Contrastar cada afirmación con la sesión; Decisión. Aprobar o rechazar según las pruebas. El rechazo incluye un motivo explícito</desc><rect width="1200" height="650" fill="#ffffff"/><defs><marker id="a-reply-eval-es" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Comprobar una respuesta con la evidencia</text><rect x="35" y="130" width="260" height="110" rx="8" fill="#fdf3e8"/><text x="165.0" y="169.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Sesión registrada</text><text x="165.0" y="196.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Se guardan llamadas y</text><text x="165.0" y="218.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">resultados</text><rect x="35" y="365" width="260" height="110" rx="8" fill="#fdf3e8"/><text x="165.0" y="404.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Borrador</text><text x="165.0" y="431.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">El modelo identifica acciones</text><text x="165.0" y="453.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">afirmadas</text><rect x="465" y="245" width="270" height="110" rx="8" fill="#fdf3e8"/><text x="600.0" y="295.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Evaluación</text><text x="600.0" y="322.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Contrasta con la sesión</text><rect x="895" y="245" width="270" height="110" rx="8" fill="#fdf3e8"/><text x="1030.0" y="284.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Decisión</text><text x="1030.0" y="311.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Aprobar o rechazar según las</text><text x="1030.0" y="333.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">pruebas</text><path d="M295 185 H365 V270 H465" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-reply-eval-es)"/><path d="M295 420 H365 V330 H465" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-reply-eval-es)"/><path d="M735 300 H895" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-reply-eval-es)"/><text x="600.0" y="615.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">El rechazo incluye un motivo explícito</text></g></svg>