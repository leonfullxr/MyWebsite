<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="local-model-loop-es-dark-title local-model-loop-es-dark-desc"><title id="local-model-loop-es-dark-title">Pasar una tarea a un especialista local</title><desc id="local-model-loop-es-dark-desc">Ejemplos. Casos reales, reglas y documentación. Un modelo frontera genera sesiones sintéticas; Ajuste fino. Sesiones revisadas entrenan una LoRA. El modelo base no cambia; Benchmark privado. Comparar modelos con tareas fijas. Los fallos orientan los próximos datos; Despliegue. El especialista asume la tarea. Un evaluador comprueba cada respuesta</desc><rect width="1200" height="650" fill="#16212c"/><defs><marker id="a-local-model-loop-es-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">Pasar una tarea a un especialista local</text><path d="M350 185 H850" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-es-dark)"/><path d="M985 240 V425" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-es-dark)"/><path d="M850 480 H350" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-es-dark)"/><path d="M1120 480 H1160 V95 H215 V130" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-local-model-loop-es-dark)"/><rect x="80" y="130" width="270" height="110" rx="8" fill="#44392e"/><text x="215.0" y="169.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Ejemplos</text><text x="215.0" y="196.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Casos reales, reglas y</text><text x="215.0" y="218.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">documentación</text><rect x="850" y="130" width="270" height="110" rx="8" fill="#44392e"/><text x="985.0" y="169.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Ajuste fino</text><text x="985.0" y="196.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Sesiones revisadas entrenan</text><text x="985.0" y="218.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">una LoRA</text><rect x="850" y="425" width="270" height="110" rx="8" fill="#44392e"/><text x="985.0" y="464.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Benchmark privado</text><text x="985.0" y="491.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Comparar modelos con tareas</text><text x="985.0" y="513.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">fijas</text><rect x="80" y="425" width="270" height="110" rx="8" fill="#44392e"/><text x="215.0" y="475.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Despliegue</text><text x="215.0" y="502.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">El especialista asume la tarea</text><text x="600.0" y="335.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">Los fallos orientan los próximos datos</text></g></svg>