<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="reply-eval-en-title reply-eval-en-desc"><title id="reply-eval-en-title">Checking a support reply against evidence</title><desc id="reply-eval-en-desc">Customer case. A card expired and payment failed. The agent investigates the account; Recorded session. Tool calls and results are captured. Code checks whether actions succeeded; Draft reply. The model identifies claimed actions. Compare each claim against the session; Decision. Approve supported claims or reject. A rejected reply has an explicit reason</desc><rect width="1200" height="650" fill="#ffffff"/><defs><marker id="a-reply-eval-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Checking a support reply against evidence</text><rect x="35" y="130" width="260" height="110" rx="8" fill="#fdf3e8"/><text x="165.0" y="169.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Recorded session</text><text x="165.0" y="196.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Tool calls and results are</text><text x="165.0" y="218.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">captured</text><rect x="35" y="365" width="260" height="110" rx="8" fill="#fdf3e8"/><text x="165.0" y="404.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Draft reply</text><text x="165.0" y="431.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">The model identifies claimed</text><text x="165.0" y="453.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">actions</text><rect x="465" y="245" width="270" height="110" rx="8" fill="#fdf3e8"/><text x="600.0" y="295.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Evaluator</text><text x="600.0" y="322.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Compare claims to the session</text><rect x="895" y="245" width="270" height="110" rx="8" fill="#fdf3e8"/><text x="1030.0" y="284.5" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Decision</text><text x="1030.0" y="311.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Approve supported claims or</text><text x="1030.0" y="333.5" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">reject</text><path d="M295 185 H365 V270 H465" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-reply-eval-en)"/><path d="M295 420 H365 V330 H465" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-reply-eval-en)"/><path d="M735 300 H895" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-reply-eval-en)"/><text x="600.0" y="615.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">A rejected reply has an explicit reason</text></g></svg>