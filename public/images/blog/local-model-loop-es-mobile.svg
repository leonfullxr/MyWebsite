<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="local-model-loop-es-mobile-title local-model-loop-es-mobile-desc"><title id="local-model-loop-es-mobile-title">Pasar una tarea a un especialista local</title><desc id="local-model-loop-es-mobile-desc">Ejemplos. Casos reales, reglas y documentación. Un modelo frontera genera sesiones sintéticas; Ajuste fino. Sesiones revisadas entrenan una LoRA. El modelo base no cambia; Benchmark privado. Comparar modelos con tareas fijas. Los fallos orientan los próximos datos; Despliegue. El especialista asume la tarea. Un evaluador comprueba cada respuesta</desc><rect width="700" height="850" fill="#ffffff"/><defs><marker id="a-local-model-loop-es-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Pasar una tarea a un especialista local</text><path d="M315 180 H385" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-local-model-loop-es-mobile)"/><path d="M515 245 V475" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-local-model-loop-es-mobile)"/><path d="M385 535 H315" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-local-model-loop-es-mobile)"/><path d="M645 535 H680 V95 H185 V120" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-local-model-loop-es-mobile)"/><rect x="55" y="120" width="260" height="125" rx="8" fill="#fdf3e8"/><text x="185.0" y="167.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Ejemplos</text><text x="185.0" y="194.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Casos reales, reglas y</text><text x="185.0" y="216.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">documentación</text><rect x="385" y="120" width="260" height="125" rx="8" fill="#fdf3e8"/><text x="515.0" y="167.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Ajuste fino</text><text x="515.0" y="194.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Sesiones revisadas entrenan</text><text x="515.0" y="216.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">una LoRA</text><rect x="385" y="475" width="260" height="125" rx="8" fill="#fdf3e8"/><text x="515.0" y="522.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Benchmark privado</text><text x="515.0" y="549.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Comparar modelos con</text><text x="515.0" y="571.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">tareas fijas</text><rect x="55" y="475" width="260" height="125" rx="8" fill="#fdf3e8"/><text x="185.0" y="533.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Despliegue</text><text x="185.0" y="560.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">El especialista asume la tarea</text><text x="350.0" y="435.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">Los fallos orientan los próximos datos</text></g></svg>