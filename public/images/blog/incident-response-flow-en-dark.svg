<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="ir-flow-en-dark-title ir-flow-en-dark-desc"><title id="ir-flow-en-dark-title">SSH alert: investigation and response</title><desc id="ir-flow-en-dark-desc">Wazuh alert. A rule matches authentication events. The alert is a reason to investigate; Analyst triage. Review the host, source and time window. Record evidence and missing telemetry; Response decision. Determine authority and customer limits. If authorized, follow a runbook; Action and review. Verify the result and record the case. Active Response is a separate automatic path</desc><rect width="1200" height="650" fill="#16212c"/><defs><marker id="a-ir-flow-en-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#d0dbe3"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="600.0" y="50.0" text-anchor="middle" fill="#f2f5f6" font-size="27" font-weight="bold">SSH alert: investigation and response</text><rect x="40" y="260" width="230" height="110" rx="8" fill="#44392e"/><text x="155.0" y="299.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Wazuh alert</text><text x="155.0" y="326.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">A rule matches</text><text x="155.0" y="348.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">authentication events</text><rect x="365" y="120" width="240" height="110" rx="8" fill="#44392e"/><text x="485.0" y="159.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Analyst triage</text><text x="485.0" y="186.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Review the host, source</text><text x="485.0" y="208.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">and time window</text><rect x="720" y="120" width="240" height="110" rx="8" fill="#44392e"/><text x="840.0" y="159.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Response decision</text><text x="840.0" y="186.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Determine authority and</text><text x="840.0" y="208.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">customer limits</text><rect x="365" y="405" width="240" height="110" rx="8" fill="#44392e"/><text x="485.0" y="455.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Active Response</text><text x="485.0" y="482.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Only if configured</text><rect x="720" y="405" width="240" height="110" rx="8" fill="#44392e"/><text x="840.0" y="444.5" text-anchor="middle" fill="#f2f5f6" font-size="22" font-weight="bold">Action and review</text><text x="840.0" y="471.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">Verify the result and</text><text x="840.0" y="493.5" text-anchor="middle" fill="#c5d0d9" font-size="18" font-weight="normal">record the case</text><path d="M270 285 H315 V175 H365" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark)"/><path d="M270 345 H315 V460 H365" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark)"/><path d="M605 175 H720" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark)"/><path d="M605 460 H720" fill="none" stroke="#d0dbe3" stroke-width="3"  marker-end="url(#a-ir-flow-en-dark)"/><text x="600.0" y="615.0" text-anchor="middle" fill="#c5d0d9" font-size="17" font-weight="normal">Active Response is a separate automatic path</text></g></svg>