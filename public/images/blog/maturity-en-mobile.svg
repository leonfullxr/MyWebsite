<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" role="img" aria-labelledby="maturity-en-mobile-title maturity-en-mobile-desc"><title id="maturity-en-mobile-title">Detection engineering: assess and improve</title><desc id="maturity-en-mobile-desc">Tiers 0 and 1. Foundation and basic practices. Begin with a defined data source or threat; Tiers 2 and 3. Intermediate and advanced practices. Record coverage, ownership and test evidence; Tier 4. Expert practices. Choose one gap and a sustainable improvement; Repeat. Review progress and reassess. Tier names adapted from Elastic DEBMM</desc><rect width="700" height="850" fill="#ffffff"/><defs><marker id="a-maturity-en-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#34495a"/></marker></defs><g font-family="Lato, Arial, sans-serif"><text x="350.0" y="50.0" text-anchor="middle" fill="#202b37" font-size="27" font-weight="bold">Detection engineering: assess and improve</text><rect x="55" y="130" width="260" height="115" rx="8" fill="#fdf3e8"/><text x="185.0" y="172.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Tiers 0 and 1</text><text x="185.0" y="199.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Foundation and basic</text><text x="185.0" y="221.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">practices</text><rect x="385" y="270" width="260" height="115" rx="8" fill="#fdf3e8"/><text x="515.0" y="312.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Tiers 2 and 3</text><text x="515.0" y="339.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Intermediate and advanced</text><text x="515.0" y="361.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">practices</text><rect x="55" y="410" width="260" height="115" rx="8" fill="#fdf3e8"/><text x="185.0" y="463.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Tier 4</text><text x="185.0" y="490.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Expert practices</text><rect x="385" y="550" width="260" height="115" rx="8" fill="#fdf3e8"/><text x="515.0" y="603.0" text-anchor="middle" fill="#202b37" font-size="22" font-weight="bold">Repeat</text><text x="515.0" y="630.0" text-anchor="middle" fill="#42515f" font-size="18" font-weight="normal">Review progress and reassess</text><path d="M315 185 H350 V325 H385" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-maturity-en-mobile)"/><path d="M385 325 H350 V465 H315" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-maturity-en-mobile)"/><path d="M315 465 H350 V605 H385" fill="none" stroke="#34495a" stroke-width="3"  marker-end="url(#a-maturity-en-mobile)"/><text x="350.0" y="805.0" text-anchor="middle" fill="#42515f" font-size="17" font-weight="normal">Tier names adapted from Elastic DEBMM</text></g></svg>