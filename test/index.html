<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elliptic Curve Visualization</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1 id="equation">Elliptic Curve: y² = x³ – x + 1</h1>
  <div id="toolbar">
    <label for="aParam">a:</label>
    <input type="number" id="aParam" value="-1" step="0.1">
    <label for="bParam">b:</label>
    <input type="number" id="bParam" value="1" step="0.1">
  </div>
  <canvas id="curveCanvas" width="500" height="500"></canvas>
  <script src="script.js"></script>
</body>
</html>
