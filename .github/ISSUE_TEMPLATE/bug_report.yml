name: Bug report
description: Report something that is broken on the site
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page / URL
      placeholder: https://resume.leonfuller.com/en/
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console output, device/OS, etc.
