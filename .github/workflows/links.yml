name: Link Check

# Crawls Markdown and Astro source for dead links. Runs on a schedule (and on
# demand) rather than on every PR so that flaky external hosts never block a
# merge; a tracking issue is opened/updated when broken links are found.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --accept 200,206,429
            './**/*.md'
            './src/**/*.astro'
          fail: false

      - name: Create issue from broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Link Checker: broken links detected'
          content-filepath: ./lychee/out.md
          labels: bug, automated, links
