name: Dependency Review

# Scans dependency manifest changes on pull requests for known-vulnerable
# packages and disallowed licenses before they are merged.
# Free on public repositories; needs GitHub Advanced Security on private ones.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Block copyleft/unknown licenses that are risky for a public site.
          deny-licenses: GPL-3.0, AGPL-3.0
